name: Rust
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: [stable, "1.89.0"]
    steps:
      - uses: actions/checkout@v6
      - name: Test global skill installation
        if: matrix.rust == 'stable'
        run: python3 tests/install_skill.py
      - name: Install toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal
      - name: Check formatting and lints
        if: matrix.rust == 'stable'
        run: |
          rustup component add rustfmt clippy --toolchain stable
          cargo +stable fmt --check
          cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo +${{ matrix.rust }} test --locked
      - name: Test with every file call reported by the kernel
        if: matrix.rust == 'stable'
        run: JATO_NOTES=0 cargo +stable test --locked --test cargo
      - name: Test with upstream mold and the pinned nightly
        if: matrix.rust == 'stable'
        run: |
          archive="$RUNNER_TEMP/mold.tar.gz"
          curl -fsSL --retry 3 https://github.com/rui314/mold/releases/download/v3.0.0/mold-3.0.0-x86_64-linux.tar.gz -o "$archive"
          echo "6c90d4a474c7c0409dfb575be03a5345878ac14fdba18de8b40fa58c60121189  $archive" | sha256sum -c -
          tar -C "$RUNNER_TEMP" -xzf "$archive" mold-3.0.0-x86_64-linux/bin/mold
          rustup toolchain install nightly-2026-11-14 --profile minimal
          JATO_TEST_MOLD="$RUNNER_TEMP/mold-3.0.0-x86_64-linux/bin/mold" \
            JATO_TEST_NIGHTLY="$(rustup which --toolchain nightly-2026-11-14 rustc)" \
            cargo +stable test --locked --test cargo -- mold nightly saved_state
