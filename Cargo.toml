[package]
name = "jato"
version = "0.17.0"
edition = "2024"
rust-version = "1.89"
description = "Remembers Rust builds: whole Cargo commands and single compilations, across checkouts and target directories"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1.8"
ctrlc = { version = "3.5", features = ["termination"] }
ignore = "0.4"
libc = "0.2"
memchr = "2"
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.5", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
notify = "8.2"

[profile.release]
lto = "thin"
strip = "symbols"
