[package]
name = "jato"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "A bounded local Rust compiler cache and workspace edit runner"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1.8"
ctrlc = { version = "3.5", features = ["termination"] }
ignore = "0.4"
libc = "0.2"
notify = "8.2"
rustc_lexer = "0.1"
memchr = "2"
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zstd = { version = "0.13", default-features = false }

[profile.release]
lto = "thin"
strip = "symbols"
