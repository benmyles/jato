[package]
name = "jato"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "A bounded local Rust compiler cache and workspace edit runner"
license = "MIT"

[dependencies]
anyhow = "1"
blake3 = "1.8"
fastcdc = { version = "5.0", default-features = false }
ctrlc = { version = "3.5", features = ["termination"] }
ignore = "0.4"
jobserver = "0.1.35"
libc = "0.2"
rustc_lexer = "0.1"
memchr = "2"
rusqlite = { version = "0.38", features = ["bundled", "fallible_uint"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zstd = { version = "0.13", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.5", default-features = false }

[target.'cfg(not(target_os = "linux"))'.dependencies]
notify = "8.2"

[profile.release]
lto = "thin"
strip = "symbols"
